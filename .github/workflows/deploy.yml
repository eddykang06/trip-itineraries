name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install markdown==3.11.3
      - run: python build.py
        env:  # Settings > Secrets and variables > Actions > Variables
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_HOME_URL: ${{ vars.SITE_HOME_URL }}
          SITE_STYLESHEET_URL: ${{ vars.SITE_STYLESHEET_URL }}
          SITE_FAVICON_URL: ${{ vars.SITE_FAVICON_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
